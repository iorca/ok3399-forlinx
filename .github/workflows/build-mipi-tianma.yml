name: Build Armbian MIPI Tianma image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel branch
        required: true
        default: current
        type: choice
        options: [current, edge]
      release:
        description: Userland release
        required: true
        default: noble
        type: choice
        options: [noble, bookworm]
  push:
    branches: [mipi-tianma]

env:
  ARMBIAN_BUILD_SHA: 04108a20e5de1c956425b3f5a2a7cba47ba829b8
  BOARD: forlinx-ok3399

jobs:
  build-mipi:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /usr/share/az_* /opt/az /opt/google /usr/local/julia* \
            /usr/share/miniconda /var/lib/apt/lists/*
          sudo apt-get clean
          sudo docker system prune -a -f 2>/dev/null || true
          df -h /

      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout pinned Armbian build
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_SHA }}
          path: armbian-build
          fetch-depth: 1

      - name: Install MIPI overlay
        run: |
          set -eux
          cp overlay/config/boards/forlinx-ok3399.conf armbian-build/config/boards/
          mkdir -p armbian-build/patch/kernel/rockchip64-current
          # patch dir contains 0000.patching_config.yaml + *.patch at its root
          # (patching.py only picks up numbered patch files from the root, and
          # reads dts-directories from the yaml).
          cp -rv overlay/patch/kernel/rockchip64-current/. \
            armbian-build/patch/kernel/rockchip64-current/
          find armbian-build/config/boards \
            armbian-build/patch/kernel/rockchip64-current \
            -type f -exec sed -i 's/\r$//' {} +
          ls -l armbian-build/patch/kernel/rockchip64-current/ \
            armbian-build/patch/kernel/rockchip64-current/dt/

      - name: Verify MIPI payload
        run: |
          set -eux
          P=armbian-build/patch/kernel/rockchip64-current
          test -f "$P/0001-drm-panel-add-iorca-tl060fvxs07.patch"
          test -f "$P/dt/rk3399-forlinx-ok3399.dts"
          test -f "$P/0000.patching_config.yaml"
          grep -q 'drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.c' "$P/0001-drm-panel-add-iorca-tl060fvxs07.patch"
          grep -q 'RK_PD5' "$P/dt/rk3399-forlinx-ok3399.dts"
          grep -q '&pwm0 0 25000' "$P/dt/rk3399-forlinx-ok3399.dts"
          grep -q 'iorca,tl060fvxs07' "$P/dt/rk3399-forlinx-ok3399.dts"
          grep -q 'custom_kernel_config' armbian-build/config/boards/forlinx-ok3399.conf

      - name: Configure shallow Linux fetch
        run: |
          set -eux
          sed -i 's|improved_git fetch "${verbose_params\[@\]}" --recurse-submodules=no|improved_git fetch "${verbose_params[@]}" --depth 1 --recurse-submodules=no|' \
            armbian-build/lib/functions/general/git.sh
          grep -n 'depth 1' armbian-build/lib/functions/general/git.sh

      - name: Build MIPI image
        run: |
          set -eux
          cd armbian-build
          sudo ./compile.sh build \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ inputs.branch || 'current' }} \
            RELEASE=${{ inputs.release || 'noble' }} \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_BTF=no

      - name: Verify image output
        run: |
          set -eux
          cd armbian-build/output/images
          ls -lh
          test -n "$(find . -maxdepth 1 -type f -iname '*Forlinx-ok3399*.img' -print -quit)"

      # 上一版镜像编译“成功”但 DTB 里根本没有屏：驱动没进 Kconfig/Makefile，
      # dtsi 也没被 include。这里读回产物做真校验，别再只看构建日志。
      - name: Verify image really carries the panel
        run: |
          set -eux
          cd armbian-build/output/images
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq device-tree-compiler
          IMG=$(find . -maxdepth 1 -type f -iname '*Forlinx-ok3399*.img' -printf '%f\n' | sort | tail -1)
          rm -rf /tmp/i /tmp/i/part0
          mkdir -p /tmp/i
          bsdtar -xf "$IMG" -C /tmp/i 2>/dev/null || \
            sudo debugfs -R "dump <parts> /tmp/i" "$IMG" 2>/dev/null || true
          ls -R /tmp/i | head -20
          DTB=$(find /tmp/i -name 'rk3399-forlinx-ok3399.dtb' -print -quit)
          test -n "${DTB}" || { echo "::error::no rk3399-forlinx-ok3399.dtb inside image"; exit 1; }
          echo "DTB=$DTB"
          # 节点路径含 "/" 和 "@"，整段加引号，否则 fdtget 参数数是奇数直接报错退出
          test "$(fdtget "${DTB}" "/panel@0" compatible)" = "iorca,tl060fvxs07"
          fdtget "${DTB}" "/panel@0" reset-gpios  # 期望 bank 4 pin 0x1d
          fdtget "${DTB}" "/dsi-backlight" pwms   # 期望 0xff420000 (PWM0)
          KO=$(find /tmp/i -name 'panel-iorca-tl060fvxs07.ko' -print -quit)
          test -n "${KO}" || { echo "::error::panel module missing in image"; exit 1; }
          echo "KO=$KO"

      - name: Compress image
        run: |
          set -eux
          cd armbian-build/output/images
          IMG=$(find . -maxdepth 1 -type f -iname '*Forlinx-ok3399*.img' -printf '%f\n' | sort | tail -1)
          xz -T0 -6 -c "$IMG" > "/tmp/${IMG}.xz"
          cp "/tmp/${IMG}.xz" "$GITHUB_WORKSPACE/"
          cp "$IMG".sha "$GITHUB_WORKSPACE/" 2>/dev/null || true

      - name: Upload MIPI image artifact
        uses: actions/upload-artifact@v4
        with:
          name: armbian-mipi-tianma-${{ github.sha }}
          path: |
            *.img.xz
            *.img.sha
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mipi-${{ github.sha }}
          name: MIPI Tianma ${{ github.sha }}
          generate_release_notes: true
          files: |
            *.img.xz
            *.img.sha
