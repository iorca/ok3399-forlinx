name: Verify MIPI Tianma payload

# 全量镜像构建要 60~70 分钟才能知道 dtc 有没有过、驱动能不能编。
# 这里用不到 10 分钟把这两件事先钉死：
#   1) 把 patch/kernel/rockchip64-current/0001-...patch 打到 v6.18.54 内核树
#   2) make dtbs 编出 rockchip/rk3399-forlinx-ok3399.dtb
#   3) make M=drivers/gpu/drm/panel modules 编出 panel-iorca-tl060fvxs07.ko
# 产物作为 artifact 上传，可直接在本地 dtc -I dtb -O dts 复核。

on:
  workflow_dispatch:
  push:
    branches: [mipi-tianma]

env:
  KERNEL_REF: v6.18.54
  PATCH: patch/kernel/rockchip64-current/0001-drm-panel-add-iorca-tl060fvxs07.patch

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /usr/share/az_* /opt/az /usr/local/julia* /usr/share/miniconda
          sudo apt-get clean
          df -h /

      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install toolchain
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu device-tree-compiler

      - name: Clone kernel
        run: |
          set -eux
          git init linux
          cd linux
          git remote add origin https://github.com/gregkh/linux.git
          git fetch --depth 1 origin tag ${{ env.KERNEL_REF }}
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Apply panel patch
        run: |
          set -eux
          cd linux
          git apply --verbose "${GITHUB_WORKSPACE}/overlay/${{ env.PATCH }}"

      - name: Sanity check payload
        run: |
          set -eux
          cd linux
          test -f drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.c
          grep -q "DRM_PANEL_IORCA_TL060FVXS07" drivers/gpu/drm/panel/Makefile
          grep -q "DRM_PANEL_IORCA_TL060FVXS07" drivers/gpu/drm/panel/Kconfig

      - name: Inject DTS
        run: |
          set -eux
          cd linux
          cp -v "${GITHUB_WORKSPACE}/overlay/patch/kernel/rockchip64-current/dt/." \
            arch/arm64/boot/dts/rockchip/
          ls -l arch/arm64/boot/dts/rockchip/

      - name: Build DTB
        run: |
          set -eux
          cd linux
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs

      - name: Verify DTB content
        run: |
          set -eux
          cd linux
          DTB=arch/arm64/boot/dts/rockchip/rk3399-forlinx-ok3399.dtb
          test -f "$DTB"
          fdtget "$DTB" / panel@0 compatible
          fdtget "$DTB" / panel@0 reset-gpios
          # RK_PD5 = bank 4, pin 29 -> 0x0000001d
          fdtget "$DTB" / panel@0 reset-gpios | grep -q "0x0000001d"
          fdtget "$DTB" / dsi-backlight pwms | grep -q "0xff420000" # PWM0
          fdtget "$DTB" / panel@0 backlight

      - name: Build panel module
        run: |
          set -eux
          cd linux
          echo "CONFIG_DRM_PANEL_IORCA_TL060FVXS07=m" >> .config
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/gpu/drm/panel modules
          test -f drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.ko
          modinfo drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.ko | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mipi-verify-${{ github.sha }}
          path: |
            linux/arch/arm64/boot/dts/rockchip/rk3399-forlinx-ok3399.dtb
            linux/drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.ko
          if-no-files-found: error
          retention-days: 30
