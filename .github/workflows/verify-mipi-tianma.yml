name: Verify MIPI Tianma payload

# 全量镜像构建要 60~70 分钟才能知道 dtc 有没有过、驱动能不能编。
# 这里用不到 10 分钟把这两件事先钉死：
#   1) 把 patch/kernel/rockchip64-current/0001-...patch 打到 v6.18.54 内核树
#   2) make dtbs 编出 rockchip/rk3399-forlinx-ok3399.dtb
#   3) make M=drivers/gpu/drm/panel modules 编出 panel-iorca-tl060fvxs07.ko
# 产物作为 artifact 上传，可直接在本地 dtc -I dtb -O dts 复核。

on:
  workflow_dispatch:
  push:
    branches: [mipi-tianma]

env:
  KERNEL_REF: v6.18.54
  PATCH: patch/kernel/rockchip64-current/0001-drm-panel-add-iorca-tl060fvxs07.patch

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /usr/share/az_* /opt/az /usr/local/julia* /usr/share/miniconda
          sudo apt-get clean
          df -h /

      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install toolchain
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu device-tree-compiler

      - name: Clone kernel
        run: |
          set -eux
          git init linux
          cd linux
          git remote add origin https://github.com/gregkh/linux.git
          git fetch --depth 1 origin tag ${{ env.KERNEL_REF }}
          git checkout FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Apply panel patch
        run: |
          set -eux
          cd linux
          git apply --verbose "${GITHUB_WORKSPACE}/overlay/${{ env.PATCH }}"

      - name: Sanity check payload
        run: |
          set -eux
          cd linux
          test -f drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.c
          grep -q "DRM_PANEL_IORCA_TL060FVXS07" drivers/gpu/drm/panel/Makefile
          grep -q "DRM_PANEL_IORCA_TL060FVXS07" drivers/gpu/drm/panel/Kconfig

      # 与 patching.py 的 dts-directories 行为一致：dt/ 下所有文件（dts + dtsi）
      # 直接铺到 arch/arm64/boot/dts/rockchip/
      - name: Inject DTS
        run: |
          set -eux
          cd linux
          cp -av "${GITHUB_WORKSPACE}/overlay/patch/kernel/rockchip64-current/dt/." \
            arch/arm64/boot/dts/rockchip/
          # overlay 里的 dts 是 CRLF，和 Armbian build 里一样统一下 LF，免得 dtc 挑刺
          sed -i 's/\r$//' arch/arm64/boot/dts/rockchip/*.dts arch/arm64/boot/dts/rockchip/*.dtsi
          ls -l arch/arm64/boot/dts/rockchip/

      # dtc 也要一份 .config（Makefile:835 的 include/config/auto.conf 依赖它），
      # 用 arm64 defconfig 起手，随后把 panel 模块选项打开。
      - name: Prepare .config
        run: |
          set -eux
          cd linux
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          echo "CONFIG_DRM_PANEL_IORCA_TL060FVXS07=m" >> .config
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -n "CONFIG_DRM_PANEL_IORCA_TL060FVXS07" .config
          # rockchip/Makefile 里的 dtb 列表挂在 CONFIG_ARCH_ROCKCHIP 下，defconfig
          # 必须把它开成 y，否则 dtb-$(CONFIG_ARCH_ROCKCHIP) 为空、一个 dtb 都不编
          grep -q "^CONFIG_ARCH_ROCKCHIP=y$" .config

      # make dtbs 只编 rockchip/Makefile 里列出的 dtb。Armbian 的
      # patching.py::auto_patch_all_dt_makefiles() 会自动把 overlay dt 目录里的
      # dts 追加进这个列表；verify 不走 Armbian 框架，这里手动补一行。
      - name: Register DTS in dt Makefile
        run: |
          set -eux
          cd linux
          DT_MAKEFILE=arch/arm64/boot/dts/rockchip/Makefile
          grep -q "rk3399-forlinx-ok3399.dtb" "$DT_MAKEFILE" \
            || echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3399-forlinx-ok3399.dtb' >> "$DT_MAKEFILE"
          grep -n "rk3399-forlinx-ok3399.dtb" "$DT_MAKEFILE"

      - name: Build DTB
        run: |
          set -eux
          cd linux
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs
          DTB=arch/arm64/boot/dts/rockchip/rk3399-forlinx-ok3399.dtb
          if [ ! -f "$DTB" ]; then
            echo "make dtbs did not emit $DTB -> compile it with dtc directly"
            make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts/dtc/dtc
            ./scripts/dtc/dtc -q -H 107 -I dts -O dtb \
              -i arch/arm64/boot/dts \
              -i arch/arm64/boot/dts/rockchip \
              -i arch/arm64/boot/dts/include \
              -i scripts/dtc/include-prefixes \
              -o "$DTB" arch/arm64/boot/dts/rockchip/rk3399-forlinx-ok3399.dts
          fi
          ls -l "$DTB"

      - name: Verify DTB content
        run: |
          set -eux
          cd linux
          DTB=arch/arm64/boot/dts/rockchip/rk3399-forlinx-ok3399.dtb
          test -f "$DTB"
          # 注意：节点路径含 "/" 和 "@"，必须整段加引号，否则 fdtget 参数数是奇数直接报错退出
          test "$(fdtget "$DTB" "/panel@0" compatible)" = "iorca,tl060fvxs07"
          fdtget "$DTB" "/panel@0" reset-gpios
          # RK_PD5 = bank 4, pin 29 -> 0x0000001d
          fdtget "$DTB" "/panel@0" reset-gpios | grep -q "0x0000001d"
          fdtget "$DTB" "/dsi-backlight" pwms | grep -q "0xff420000" # PWM0
          fdtget "$DTB" "/panel@0" backlight
          echo "DTB payload verified"

      - name: Build panel module
        run: |
          set -eux
          cd linux
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/gpu/drm/panel modules
          test -f drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.ko
          modinfo drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.ko | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mipi-verify-${{ github.sha }}
          path: |
            linux/arch/arm64/boot/dts/rockchip/rk3399-forlinx-ok3399.dtb
            linux/drivers/gpu/drm/panel/panel-iorca-tl060fvxs07.ko
          if-no-files-found: error
          retention-days: 30
