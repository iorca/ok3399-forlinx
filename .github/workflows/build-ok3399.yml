name: Build Armbian image for Forlinx OK3399

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch'
        required: true
        default: 'current'
        type: choice
        options: [current, edge]
      release:
        description: 'Userland release'
        required: true
        default: 'noble'
        type: choice
        options: [noble, bookworm]
      rootfs_url:
        description: 'Prebuilt rootfs cache tarball URL (optional; see README "rootfs剥离"). Leave empty to build it in-job.'
        required: false
        default: ''
        type: string
  push:
    branches: [main, master]

# ---------------------------------------------------------------------------
# GitHub-hosted ubuntu-24.04 runner: 2 核 / 7GB RAM / ~14GB SSD，job 上限 6 小时。
# 这版 workflow 就是为了让完整构建塞进这个上限而写的，关键的四个省时点：
#   1. KERNEL_BTF=no     —— BTF 要 6451 MiB 内存（runner 只有 ~6.8GB）且 pahole 在 2 核上极慢
#   2. rootfs 剥离       —— 复用预置 rootfs，省掉 debootstrap + 包安装的 15~25 分钟
#   3. git fetch --depth 1 —— Linux 完整历史好几个 GB，shallow 能省下 clone 时间和磁盘
#   4. ccache            —— 第二次起内核编译大幅加速
# 想更稳就换自托管 runner：把 runs-on 改成 [self-hosted, linux, x64]，其余不用动。
# ---------------------------------------------------------------------------
env:
  # armbian/build 固定提交，避免上游改动把构建搞挂
  ARMBIAN_BUILD_SHA: 04108a20e5de1c956425b3f5a2a7cba47ba829b8
  BOARD: forlinx-ok3399
  BRANCH: current
  RELEASE: noble
  # rootfs cache id：与板子无关，只取决于 release/arch/包列表。
  # 这个值取自构建机上已生成的 rootfs 文件名，包配置不变就不会变。
  ROOTFS_CACHE_ID: de3dd0bda694
  ROOTFS_CACHE_SUFFIX: H6eccde-Bf1b6db

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        # runner 只剩 ~14GB；内核 worktree + rootfs + 2.8GB 镜像会撑爆
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Checkout overlay (this repo)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout armbian/build (pinned SHA)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_SHA }}
          path: armbian-build
          fetch-depth: 1

      - name: Install overlay + shallow-fetch tweak
        run: |
          set -e
          cp -v overlay/config/boards/forlinx-ok3399.conf armbian-build/config/boards/
          mkdir -p armbian-build/patch/kernel/rockchip64-current
          cp -rv overlay/patch/kernel/rockchip64-current/. armbian-build/patch/kernel/rockchip64-current/
          # Windows 换行会毁掉 dts 预处理和 shell heredoc，统一清一遍
          find armbian-build/patch/kernel/rockchip64-current -type f -exec sed -i 's/\r$//' {} \;
          sed -i 's/\r$//' armbian-build/config/boards/forlinx-ok3399.conf
          # Linux 完整 git 历史好几个 GB，改成 shallow fetch 省时间和磁盘。
          # 注意用单引号：双引号会让 shell 把 ${verbose_params[@]} 展开成空串。
          sed -i 's|improved_git fetch "${verbose_params[@]}" --recurse-submodules=no|improved_git fetch "${verbose_params[@]}" --depth 1 --recurse-submodules=no|' \
            armbian-build/lib/functions/general/git.sh
          grep -n 'depth 1' armbian-build/lib/functions/general/git.sh || echo "WARN: git.sh tweak did not apply"
          echo "--- overlay files ---"
          find armbian-build/patch/kernel/rockchip64-current -type f

      # ---------------------------------------------------------------------
      # rootfs 剥离
      # armbian 的 rootfs 缓存名是精确匹配的：
      #   cache/rootfs/rootfs-${ARCH}-${RELEASE}-${cache_type}_${YYYYMM}-${rootfs_cache_id}-${suffix}.tar.zst
      # 其中 YYYYMM 是「按月强制刷新」（artifact-rootfs.sh:46-51 有注释明说）。
      # 所以把预置 tarball 改名成当月的名字就能命中，跨月也能继续复用。
      # 命中失败不会报错，框架会自己重建 —— 只是慢，不会坏。
      # ---------------------------------------------------------------------
      - name: Fetch prebuilt rootfs cache
        if: ${{ github.event.inputs.rootfs_url != '' }}
        run: |
          set -e
          mkdir -p armbian-build/cache/rootfs
          YM=$(date +%Y%m)
          curl -fL --retry 3 -o /tmp/rootfs.tar.zst "${{ github.event.inputs.rootfs_url }}"
          ls -la /tmp/rootfs.tar.zst
          mv /tmp/rootfs.tar.zst \
            "armbian-build/cache/rootfs/rootfs-arm64-${{ env.RELEASE }}-cli_${YM}-${{ env.ROOTFS_CACHE_ID }}-${{ env.ROOTFS_CACHE_SUFFIX }}.tar.zst"
          ls -la armbian-build/cache/rootfs/

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: armbian-build/cache/ccache
          key: ccache-${{ env.BOARD }}-${{ env.BRANCH }}-${{ env.RELEASE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.BOARD }}-${{ env.BRANCH }}-${{ env.RELEASE }}-
            ccache-${{ env.BOARD }}-

      - name: Restore in-job rootfs cache
        if: ${{ github.event.inputs.rootfs_url == '' }}
        uses: actions/cache@v4
        with:
          path: armbian-build/cache/rootfs
          key: rootfs-${{ env.RELEASE }}-arm64-cli

      - name: Build image
        run: |
          cd armbian-build
          sudo ./compile.sh build \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=${{ env.RELEASE }} \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_BTF=no

      - name: Collect artifacts
        run: |
          cd armbian-build/output/images
          ls -la
          mkdir -p /tmp/out
          IMG=$(ls -t *Forlinx-ok3399*.img | head -1)
          echo "IMG=$IMG"
          # Release 附件单文件上限 2GB，裸镜像接近 3GB，必须压缩
          xz -T0 -6 -c "$IMG" > "/tmp/out/${IMG}.xz"
          cp -v "$IMG".sha /tmp/out/ 2>/dev/null || true
          cp -v "$IMG".txt /tmp/out/ 2>/dev/null || true
          # rootfs 顺手也传出去，下次可以直接填进 rootfs_url 复用
          cp -v ../../../cache/rootfs/*.tar.zst /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out

      - name: Upload debs (kernel / dtb / u-boot)
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ github.run_number }}
          path: armbian-build/output/debs/*.deb
          retention-days: 7

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ok3399-${{ github.run_number }}
          name: "OK3399 Armbian ${{ env.RELEASE }} (kernel ${{ env.BRANCH }})"
          body: |
            Forlinx OK3399 / RK3399 Armbian image.
            - armbian/build: `${{ env.ARMBIAN_BUILD_SHA }}`
            - U-Boot: v2025.01（only-blobs: rkbin DDR + miniloader + BL31）
            - KERNEL_BTF=no（BTF 需要 6451 MiB 内存，runner 上跑不动）
            - 烧录: SD 卡 dd；eMMC 用 rkdeveloptool
            - 串口: UART2 1500000 8N1
            - rootfs cache id: `${{ env.ROOTFS_CACHE_ID }}`（同 release/arch/包列表可直接复用）
          files: |
            /tmp/out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
