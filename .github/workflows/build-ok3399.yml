name: Build Armbian image for Forlinx OK3399

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch'
        required: true
        default: 'current'
        type: choice
        options: [current, edge]
      release:
        description: 'Userland release'
        required: true
        default: 'noble'
        type: choice
        options: [noble, bookworm]
  push:
    branches: [main, master]

# ---------------------------------------------------------------------------
# 拆成两个 job，只为绕开 GitHub-hosted runner 的 6 小时单 job 上限：
#
#   job1 rootfs : compile.sh rootfs   -> 只做 debootstrap+包安装，20~30 分钟
#   job2 image  : compile.sh build    -> u-boot + 内核 + 打包，3.5~4.5 小时
#
# rootfs 通过 artifact 在同一次 run 内传给 job2，同时用 actions/cache 跨 run 复用。
#
# runner 规格：2 核 / 7GB RAM / ~14GB SSD。
# 四个省时点（都查过框架源码）：
#   1. KERNEL_BTF=no       —— armbian-kernel.sh:161 要求 6451 MiB 内存，runner 只有 ~6.8GB，
#                             且 pahole 在 2 核上极慢。这是能不能跑完的关键开关。
#   2. rootfs 剥离         —— artifact-rootfs.sh:46-51 明说缓存版本含 YYYYMM「按月强制刷新」，
#                             所以复用时要把文件名里的月份改成当月才能命中。
#   3. git fetch --depth 1 —— Linux 完整历史好几个 GB，shallow 省时间和磁盘。
#   4. ccache              —— 第二次起内核编译大幅加速。
#
# 换成自托管 runner 只需把两处 runs-on 改成 [self-hosted, linux, x64]。
# ---------------------------------------------------------------------------
env:
  # armbian/build 固定提交
  ARMBIAN_BUILD_SHA: 04108a20e5de1c956425b3f5a2a7cba47ba829b8
  BOARD: forlinx-ok3399
  BRANCH: current
  RELEASE: noble

# 两个 job 都要用到的准备步骤，写成复合 action 太重，直接复制三步即可
jobs:
  # =========================================================================
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout overlay (this repo)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout armbian/build (pinned SHA)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_SHA }}
          path: armbian-build
          fetch-depth: 1

      - name: Install overlay
        run: |
          set -e
          cp -v overlay/config/boards/forlinx-ok3399.conf armbian-build/config/boards/
          mkdir -p armbian-build/patch/kernel/rockchip64-current
          cp -rv overlay/patch/kernel/rockchip64-current/. armbian-build/patch/kernel/rockchip64-current/
          find armbian-build/patch/kernel/rockchip64-current -type f -exec sed -i 's/\r$//' {} \;
          sed -i 's/\r$//' armbian-build/config/boards/forlinx-ok3399.conf

      # 跨 run 复用。缓存里的文件带着生成时的月份，先改名成当月才能命中
      # （armbian 的 rootfs 缓存是精确文件名匹配，且按月强制刷新）。
      - name: Restore rootfs cache
        id: rootfs_cache
        uses: actions/cache@v4
        with:
          path: armbian-build/cache/rootfs
          key: rootfs-${{ env.RELEASE }}-arm64-cli

      - name: Re-stamp cached rootfs to current month
        if: steps.rootfs_cache.outputs.cache-hit == 'true'
        run: |
          cd armbian-build/cache/rootfs
          YM=$(date +%Y%m)
          for f in rootfs-*.tar.zst; do
            new=$(echo "$f" | sed "s/_[0-9]\{6\}-/_${YM}-/")
            [ "$f" != "$new" ] && mv -v "$f" "$new"
          done
          ls -la

      - name: Build rootfs cache
        run: |
          cd armbian-build
          sudo ./compile.sh rootfs \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=${{ env.RELEASE }} \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no

      - name: Export rootfs for job2
        run: |
          set -e
          cd armbian-build/cache/rootfs
          ls -la
          F=$(ls -t rootfs-*.tar.zst | head -1)
          [ -n "$F" ] || { echo "no rootfs cache produced"; exit 1; }
          basename "$F" > /tmp/rootfs-filename.txt
          cp -v "$F" /tmp/rootfs-cache.tar.zst
          ls -la /tmp/rootfs-cache.tar.zst
          cat /tmp/rootfs-filename.txt

      - name: Upload rootfs cache
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-cache
          path: |
            /tmp/rootfs-cache.tar.zst
            /tmp/rootfs-filename.txt
          retention-days: 2

  # =========================================================================
  image:
    needs: rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        # ~14GB 要塞下内核 worktree + rootfs + 2.8GB 镜像 + xz 产物。
        # 磁盘不够是最常见的失败原因，所以这里砍得狠一点，并且前后都打印 df 便于事后判断。
        run: |
          echo "=== before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
                     /usr/lib/jvm /usr/share/az_* /opt/az /opt/google /usr/local/julia* \
                     /usr/share/miniconda /var/lib/apt/lists/*
          sudo apt-get clean
          sudo docker system prune -a -f 2>/dev/null || true
          echo "=== after ==="; df -h /

      - name: Checkout overlay (this repo)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout armbian/build (pinned SHA)
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_SHA }}
          path: armbian-build
          fetch-depth: 1

      - name: Install overlay + shallow-fetch tweak
        run: |
          set -e
          cp -v overlay/config/boards/forlinx-ok3399.conf armbian-build/config/boards/
          mkdir -p armbian-build/patch/kernel/rockchip64-current
          cp -rv overlay/patch/kernel/rockchip64-current/. armbian-build/patch/kernel/rockchip64-current/
          find armbian-build/patch/kernel/rockchip64-current -type f -exec sed -i 's/\r$//' {} \;
          sed -i 's/\r$//' armbian-build/config/boards/forlinx-ok3399.conf
          # Linux 完整 git 历史好几个 GB，改成 shallow fetch。
          # 注意用单引号：双引号会让 shell 把 ${verbose_params[@]} 展开成空串。
          sed -i 's|improved_git fetch "${verbose_params[@]}" --recurse-submodules=no|improved_git fetch "${verbose_params[@]}" --depth 1 --recurse-submodules=no|' \
            armbian-build/lib/functions/general/git.sh
          grep -n 'depth 1' armbian-build/lib/functions/general/git.sh || echo "WARN: git.sh tweak did not apply"

      - name: Download rootfs cache from job1
        uses: actions/download-artifact@v4
        with:
          name: rootfs-cache
          path: ${{ runner.temp }}/rf

      - name: Install rootfs into cache dir (re-stamped to current month)
        run: |
          set -e
          # 不要假设 artifact 解包后的确切路径：upload 时用的是绝对路径，
          # 解包后文件可能落在 <path>/ 下也可能带一层 tmp/。一律 find 定位。
          echo "--- artifact tree ---"
          find "${{ runner.temp }}/rf" -type f | head -20
          TARBALL=$(find "${{ runner.temp }}/rf" -name 'rootfs-cache.tar.zst' | head -1)
          NAMEFILE=$(find "${{ runner.temp }}/rf" -name 'rootfs-filename.txt' | head -1)
          [ -n "$TARBALL" ] || { echo "FATAL: rootfs-cache.tar.zst not found in artifact"; exit 1; }
          [ -n "$NAMEFILE" ] || { echo "FATAL: rootfs-filename.txt not found in artifact"; exit 1; }
          NAME=$(cat "$NAMEFILE")
          YM=$(date +%Y%m)
          NEW=$(echo "$NAME" | sed "s/_[0-9]\{6\}-/_${YM}-/")
          echo "rootfs: $NAME -> $NEW"
          mkdir -p armbian-build/cache/rootfs
          mv "$TARBALL" "armbian-build/cache/rootfs/$NEW"
          ls -la armbian-build/cache/rootfs/

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: armbian-build/cache/ccache
          key: ccache-${{ env.BOARD }}-${{ env.BRANCH }}-${{ env.RELEASE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.BOARD }}-${{ env.BRANCH }}-${{ env.RELEASE }}-
            ccache-${{ env.BOARD }}-

      - name: Build image
        run: |
          echo "=== disk before build ==="; df -h /
          cd armbian-build
          sudo ./compile.sh build \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=${{ env.RELEASE }} \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_BTF=no

      - name: Compress and collect
        run: |
          set -e
          cd armbian-build/output/images
          ls -la
          mkdir -p /tmp/out
          IMG=$(ls -t *Forlinx-ok3399*.img | head -1)
          # Release 附件单文件上限 2GB，裸镜像接近 3GB，必须压缩
          xz -T0 -6 -c "$IMG" > "/tmp/out/${IMG}.xz"
          cp -v "$IMG".sha "$IMG".txt /tmp/out/ 2>/dev/null || true
          cp -v ../../../cache/rootfs/*.tar.zst /tmp/out/ 2>/dev/null || true
          # 打完镜像就不需要 2.8GB 的裸镜像了，腾出来给后续步骤
          rm -f "$IMG"
          # debs 一并进 Release（不占 artifact 存储配额）
          cp -v ../debs/*.deb /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ok3399-${{ github.run_number }}
          name: "OK3399 Armbian ${{ env.RELEASE }} (kernel ${{ env.BRANCH }})"
          body: |
            Forlinx OK3399 / RK3399 Armbian image, built by GitHub Actions (2-job split).
            - armbian/build: `${{ env.ARMBIAN_BUILD_SHA }}`
            - U-Boot: v2025.01（only-blobs: rkbin DDR + miniloader + BL31）
            - KERNEL_BTF=no（BTF 需要 6451 MiB 内存，runner 上跑不动）
            - 烧录: SD 卡 dd；eMMC 用 rkdeveloptool
            - 串口: UART2 1500000 8N1
            - `rootfs-*.tar.zst` 可直接跨构建复用（cache id 与板子无关）
          files: |
            /tmp/out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
